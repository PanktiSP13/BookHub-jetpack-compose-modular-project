
name: AI PR Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        run: |
          git diff \
            origin/${{ github.event.pull_request.base.ref }}...HEAD \
            > pr.diff

      - name: Show diff size
        run: |
          echo "PR diff created"
          wc -l pr.diff